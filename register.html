<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
</head>

<body>
    <div>
        <h1>Registeration Form</h1>
    </div>

    <form action="/action">
        <div>
            <label for="username">Full Name</label>
            <input type="text" placeholder="Enter your full name" autocomplete="name" id="username" required>
        </div>

        <div>
            <label for="email">Email Address</label>
            <input type="email" placeholder="Enter your email address" id="email">
        </div>

        <div>
            <label for="phone">Phone Number (optional)</label>
            <input type="text" placeholder=" e.g. +92 300 1234567" autocomplete="tel" id="phone"><br>
            <small>Enter your phone number in international format</small>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password(Minimum 12 characters)" autocomplete="new-password"
                id="password">
            <br>
            <small>Password must be atleat 12 characters long</small>
        </div>

        <div>
            <label for="Country">Country</label>
            <select id="Country" name="country" required>
                <option value="">Select a country</option>
                <option value="India">India</option>
                <option value="England">England</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Canada">Canada</option>

            </select>
        </div>
        <fieldset>

            <legend>Preffered Track</legend>
            <div>
                <input type="radio" id="Frontend" name="track" value="Frontend">
                <label for="Frontend">Frontend</label>
            </div>
            <br>

            <div>
                <input type="radio" id="Backend" name="track" value="Backend">
                <label for="Backend">Backend</label>
            </div>
            <br>

            <div>
                <input type="radio" id="DataandAnalytics" name="track" value="Data and Analytics">
                <label for="DataandAnalytics">Data and Analytics</label>
            </div>
        </fieldset>


        <fieldset>
            <legend>Interests</legend>

            <div>
                <input type="checkbox" id="web-development" name="interests" value="web-development">
                <label for="web-development">Web Development</label>
            </div>

            <div>
                <input type="checkbox" id="artificial-intelligence" name="interests" value="artificial-intelligence">
                <label for="artificial-intelligence">Artificial Intelligence</label>
            </div>

            <div>
                <input type="checkbox" id="cybersecurity" name="interests" value="cybersecurity">
                <label for="cybersecurity">Cybersecurity</label>
            </div>

            <div>
                <input type="checkbox" id="robotics" name="interests" value="robotics">
                <label for="robotics">Robotics</label>
            </div>
        </fieldset>

        <div>
           <label for="level">Experience Level</label> 
            <select id="level" name="Level">
                <option value="" >Select your experience level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>

        <div>
            <label for="message">Message(optional)</label>
                <textarea 
                      placeholder="Tell us whu you want to join..."
                      id="message"
                      name="message"
                      maxlength="500" rows="4"
                      cols="40"></textarea>
            
        </div>

        <div>
             <input type="checkbox" id="concent" name="checkbox" value="checkbox" required>
             <label for="concent">I agree to be contacted about this workshop</label>
        </div>
        
        <div>
            <button>Register</button>
        </div>


    </form>
</body>

</html>
